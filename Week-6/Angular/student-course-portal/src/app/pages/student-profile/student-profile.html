<h2>Student Profile</h2>

<table border="1" cellpadding="8">
  <tr>
    <th>ID</th>
    <td>{{ student.id }}</td>
  </tr>

  <tr>
    <th>Name</th>
    <td>{{ student.name }}</td>
  </tr>

  <tr>
    <th>Department</th>
    <td>{{ student.department }}</td>
  </tr>

  <tr>
    <th>Year</th>
    <td>{{ student.year }}</td>
  </tr>

  <tr>
    <th>Email</th>
    <td>{{ student.email }}</td>
  </tr>
</table>
